<div class="container py-5 page-form-container">
    <div class="card bg-dark border border-danger shadow-sm">
        <div class="card-body">

            <h1 class="h4 text-light mb-3">
                Recuperar senha
            </h1>

            <p class="text-secondary">
                Informe o e-mail cadastrado para receber o link de redefinição de senha.
            </p>

            <div
                id="forgotPasswordAlert"
                class="alert d-none"
                role="alert"
            ></div>

            <form
                id="forgotPasswordForm"
                autocomplete="on"
            >
                <div class="mb-3">

                    <label
                        for="forgotPasswordEmail"
                        class="form-label text-secondary"
                    >
                        E-mail
                    </label>

                    <input
                        id="forgotPasswordEmail"
                        class="form-control bg-black text-light border-secondary"
                        type="email"
                        autocomplete="email"
                        required
                    />

                </div>

                <button
                    id="forgotPasswordButton"
                    class="btn btn-danger w-100"
                    type="submit"
                >
                    Enviar link
                </button>

                <div class="text-center mt-3">

                    <a
                        href="/login"
                        data-route="login"
                        class="text-secondary"
                    >
                        Voltar para o login
                    </a>

                </div>

            </form>

        </div>
    </div>
</div>
