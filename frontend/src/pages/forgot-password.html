<div class="d-flex justify-content-center mt-5">
  <div
    class="card shadow card-transparent"
    style="
      min-width: 320px;
      max-width: 420px;
      width: 100%;
    "
  >
    <div class="card-header text-center bg-dark text-light">
      Recuperar senha
    </div>

    <div class="card-body">
      <p class="text-light">
        Informe o e-mail cadastrado para receber o link de redefinição de senha.
      </p>

      <div
        id="forgotPasswordAlert"
        class="alert d-none"
        role="alert"
      ></div>

      <form id="forgotPasswordForm">
        <div class="mb-3">
          <label
            for="forgotPasswordEmail"
            class="form-label text-light"
          >
            E-mail
          </label>

          <input
            type="email"
            class="form-control"
            id="forgotPasswordEmail"
            autocomplete="email"
            required
          >
        </div>

        <div class="d-flex gap-2 flex-wrap">
          <button
            type="submit"
            id="forgotPasswordButton"
            class="btn btn-blood text-smoke flex-fill"
          >
            Enviar link
          </button>

          <button
            type="button"
            class="btn btn-outline-light flex-fill"
            onclick="loadPage('login')"
          >
            Voltar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
