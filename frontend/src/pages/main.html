<div id="loadingScreen">
    <br>
</div>

<div id="mainPage" style="display: none;">

    <!-- Validação de e-mail -->
    <div id="emailValidationContainer"></div>

    <!-- Conteúdo liberado somente após validar o e-mail -->
    <div
        id="verifiedMainContent"
        style="display: none;"
    >

        <!-- Cabeçalho -->
        <div class="mb-4">

            <h1
                id="mainGreeting"
                class="h3 text-light mb-1"
            ></h1>

            <p class="text-secondary mb-0">
                Bem-vindo ao ByNight.
            </p>

        </div>

        <!-- Áreas principais -->
        <div class="row g-4 mt-2">

            <!-- Personagens -->
            <div class="col-12 col-lg-6">

                <div
                    class="card bg-dark border-danger shadow h-100"
                >

                    <div
                        class="card-body d-flex flex-column p-4"
                    >

                        <div class="mb-4">

                            <h2 class="h4 text-light mb-2">
                                Personagens
                            </h2>

                            <p class="text-secondary mb-0">
                                Crie e gerencie seus personagens de jogador.
                            </p>

                        </div>

                        <div class="mt-auto">

                            <p class="text-secondary small">
                                Você ainda não possui personagens cadastrados.
                            </p>

                            <button
                                id="createCharacterButton"
                                type="button"
                                class="btn btn-blood w-100"
                            >
                                Criar meu primeiro personagem
                            </button>

                        </div>

                    </div>

                </div>

            </div>

            <!-- Houses -->
            <div class="col-12 col-lg-6">

                <div
                    class="card bg-dark border-danger shadow h-100"
                >

                    <div
                        class="card-body d-flex flex-column p-4"
                    >

                        <div class="mb-4">

                            <h2 class="h4 text-light mb-2">
                                Houses
                            </h2>

                            <p class="text-secondary mb-0">
                                Crie uma House para organizar seus jogos,
                                personagens e narradores.
                            </p>

                        </div>

                        <div class="mt-auto">

                            <p class="text-secondary small">
                                Você ainda não possui nenhuma House cadastrada.
                            </p>

                            <button
                                id="createHouseButton"
                                type="button"
                                class="btn btn-blood w-100"
                            >
                                Criar minha primeira House
                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<div id="overlay-root"></div>
