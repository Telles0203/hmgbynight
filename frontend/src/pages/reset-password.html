<div class="container py-5" style="max-width: 520px;">
    <div class="card bg-dark border border-danger shadow-sm">
        <div class="card-body">

            <h1 class="h4 text-light mb-3">
                Redefinir senha
            </h1>

            <p class="text-secondary">
                Informe sua nova senha.
            </p>

            <div
                id="resetPasswordAlert"
                class="alert d-none"
                role="alert"
            ></div>

            <form
                id="resetPasswordForm"
                autocomplete="off"
            >

                <div class="mb-3">

                    <label
                        for="newPassword"
                        class="form-label text-secondary"
                    >
                        Nova senha
                    </label>

                    <input
                        id="newPassword"
                        class="form-control bg-black text-light border-secondary"
                        type="password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    />

                </div>

                <div class="mb-3">

                    <label
                        for="confirmPassword"
                        class="form-label text-secondary"
                    >
                        Confirmar nova senha
                    </label>

                    <input
                        id="confirmPassword"
                        class="form-control bg-black text-light border-secondary"
                        type="password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    />

                </div>

                <button
                    id="resetPasswordButton"
                    class="btn btn-danger w-100"
                    type="submit"
                >
                    Alterar senha
                </button>

                <div class="text-center mt-3">

                    <a
                        href="/login"
                        data-route="login"
                        class="text-secondary"
                    >
                        Voltar para o login
                    </a>

                </div>

            </form>

        </div>
    </div>
</div>
