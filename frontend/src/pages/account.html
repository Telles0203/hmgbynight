<div class="container py-5" style="max-width: 720px;">
    <div class="card bg-dark border border-danger shadow-sm">
        <div class="card-body">

            <h1 class="h4 text-light mb-4">
                Minha conta
            </h1>

            <div
                id="accountAlert"
                class="alert d-none"
                role="alert"
            ></div>

            <!-- Dados da conta -->
            <section class="mb-4">

                <h2 class="h5 text-light mb-3">
                    Dados da conta
                </h2>

                <!-- Nome -->
                <div class="mb-3">

                    <label
                        for="accountName"
                        class="form-label text-secondary"
                    >
                        Nome
                    </label>

                    <input
                        id="accountName"
                        type="text"
                        class="form-control bg-black text-light border-secondary"
                        disabled
                    >

                    <div class="mt-2">

                        <button
                            id="editNameButton"
                            type="button"
                            class="btn btn-outline-light btn-sm"
                        >
                            Alterar nome
                        </button>

                        <button
                            id="saveNameButton"
                            type="button"
                            class="btn btn-danger btn-sm d-none"
                        >
                            Salvar
                        </button>

                        <button
                            id="cancelNameButton"
                            type="button"
                            class="btn btn-outline-secondary btn-sm d-none"
                        >
                            Cancelar
                        </button>

                    </div>

                </div>

                <!-- E-mail -->
                <div class="mb-3">

                    <label
                        for="accountEmail"
                        class="form-label text-secondary"
                    >
                        E-mail
                    </label>

                    <input
                        id="accountEmail"
                        type="email"
                        class="form-control bg-black text-light border-secondary"
                        disabled
                    >

                </div>

                <div>
                    <span class="text-secondary">
                        Status do e-mail:
                    </span>

                    <span
                        id="accountEmailStatus"
                        class="badge bg-secondary"
                    >
                        Carregando...
                    </span>
                </div>

            </section>

            <hr class="border-secondary">

            <!-- Segurança -->
            <section class="mb-4">

                <h2 class="h5 text-light mb-3">
                    Segurança
                </h2>

                <button
                    id="changePasswordButton"
                    type="button"
                    class="btn btn-outline-light"
                >
                    Alterar senha
                </button>

                <div
                    id="changePasswordForm"
                    class="d-none mt-3"
                >

                    <div class="mb-3">
                        <label
                            for="currentPassword"
                            class="form-label text-secondary"
                        >
                            Senha atual
                        </label>

                        <input
                            id="currentPassword"
                            type="password"
                            class="form-control bg-black text-light border-secondary"
                            autocomplete="current-password"
                        >
                    </div>

                    <div class="mb-3">
                        <label
                            for="newAccountPassword"
                            class="form-label text-secondary"
                        >
                            Nova senha
                        </label>

                        <input
                            id="newAccountPassword"
                            type="password"
                            class="form-control bg-black text-light border-secondary"
                            autocomplete="new-password"
                            minlength="6"
                        >
                    </div>

                    <div class="mb-3">
                        <label
                            for="confirmAccountPassword"
                            class="form-label text-secondary"
                        >
                            Confirmar nova senha
                        </label>

                        <input
                            id="confirmAccountPassword"
                            type="password"
                            class="form-control bg-black text-light border-secondary"
                            autocomplete="new-password"
                            minlength="6"
                        >
                    </div>

                    <button
                        id="savePasswordButton"
                        type="button"
                        class="btn btn-danger btn-sm"
                    >
                        Salvar nova senha
                    </button>

                    <button
                        id="cancelPasswordButton"
                        type="button"
                        class="btn btn-outline-secondary btn-sm"
                    >
                        Cancelar
                    </button>

                </div>

            </section>

            <hr class="border-secondary">

            <!-- Sessão -->
            <section>

                <h2 class="h5 text-light mb-3">
                    Sessão
                </h2>

                <button
                    type="button"
                    class="btn btn-danger"
                    onclick="logoutUser()"
                >
                    Sair da conta
                </button>

            </section>

        </div>
    </div>
</div>
